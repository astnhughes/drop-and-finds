<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Drop &amp; Finds</title>

  <!-- Make the page fill the iPad screen, including under the notch/rounded corners -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- These lines let it open full screen from the iPad Home Screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Drop & Finds">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#12141c">

  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header class="top-bar">
    <h1>Drop &amp; Finds</h1>
    <p id="status" class="status">Loading the map…</p>
  </header>

  <main>
    <!-- Screen 1: Drop Picker -->
    <section id="screen-drop" class="screen drop-screen">
      <!-- The wheel. app.js draws the slices inside the <svg>. -->
      <div class="wheel-box">
        <div class="wheel-wrap">
          <svg id="wheel" class="wheel" viewBox="0 0 500 500" aria-label="Wheel of locations"></svg>
          <div class="pointer"></div>
        </div>
      </div>

      <!-- The answer and the buttons -->
      <div class="drop-panel">
        <p class="drop-label">Drop at</p>
        <p id="result" class="result">Tap Spin!</p>
        <button id="spin" class="big-button primary" disabled>Spin</button>
        <button id="pick" class="big-button" disabled>Pick</button>
        <button id="skip" class="big-button" disabled>Skip this spot</button>
        <p id="skipped-note" class="hint" hidden></p>
        <button id="reset" class="small-button" hidden>Put all spots back</button>
      </div>
    </section>

    <!-- Screen 2: My Finds (pins arrive in step 3) -->
    <section id="screen-finds" class="screen" hidden>
      <!-- Shows after you tap Pick on the wheel -->
      <div id="drop-banner" class="drop-banner" hidden>
        <span>Dropping at <strong id="drop-name"></strong></span>
        <button id="drop-clear" class="small-button">Clear</button>
      </div>

      <div class="map-box">
        <!-- The map picture, with markers drawn on top of it -->
        <div class="map-wrap">
          <img id="map-blank" class="map" alt="Map without names">
          <!-- Max's pins get added here by app.js -->
          <div id="pins"></div>
          <div id="drop-marker" class="drop-marker" hidden>
            <div class="drop-ring"></div>
            <div class="drop-dot"></div>
            <div id="drop-marker-label" class="drop-marker-label"></div>
          </div>
        </div>
      </div>
      <p id="finds-hint" class="hint">Tap the map to drop a pin.</p>
    </section>
  </main>

  <!-- Pop-up cards. The dark backdrop covers the app while one is open. -->
  <div id="backdrop" class="backdrop" hidden>
    <!-- Card 1: making a new pin -->
    <div id="pin-form" class="card" hidden>
      <h2>New find</h2>
      <p class="card-label">What is it?</p>
      <div id="category-buttons" class="category-buttons"></div>
      <p class="card-label">Note (optional)</p>
      <input id="note" class="note-input" type="text" maxlength="80"
             placeholder="Like: behind the waterfall" autocomplete="off">
      <div class="card-actions">
        <button id="pin-cancel" class="big-button">Cancel</button>
        <button id="pin-save" class="big-button primary" disabled>Save pin</button>
      </div>
    </div>

    <!-- Card 2: looking at a pin you already made -->
    <div id="pin-view" class="card" hidden>
      <h2 id="view-title"></h2>
      <p id="view-note" class="view-note"></p>
      <div class="card-actions">
        <button id="view-close" class="big-button primary">Close</button>
      </div>
    </div>
  </div>

  <!-- The two big buttons at the bottom that switch screens -->
  <nav class="tabs">
    <button class="tab active" data-screen="screen-drop">Drop Picker</button>
    <button class="tab" data-screen="screen-finds">My Finds</button>
  </nav>

  <script src="app.js?v=5"></script>
</body>
</html>
