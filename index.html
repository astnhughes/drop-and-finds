<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Drop &amp; Finds</title>

  <!-- Make the page fill the iPad screen, including under the notch/rounded corners -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- These lines let it open full screen from the iPad Home Screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Drop & Finds">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#12141c">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <h1>Drop &amp; Finds</h1>
    <p id="status" class="status">Loading the map…</p>
  </header>

  <main>
    <!-- Screen 1: Drop Picker (the wheel arrives in step 2) -->
    <section id="screen-drop" class="screen">
      <div class="map-box">
        <img id="map-named" class="map" alt="Map with location names">
      </div>
      <p class="hint">The spinning wheel goes here next.</p>
    </section>

    <!-- Screen 2: My Finds (pins arrive in step 3) -->
    <section id="screen-finds" class="screen" hidden>
      <div class="map-box">
        <img id="map-blank" class="map" alt="Map without names">
      </div>
      <p class="hint">Tapping the map to drop pins comes soon.</p>
    </section>
  </main>

  <!-- The two big buttons at the bottom that switch screens -->
  <nav class="tabs">
    <button class="tab active" data-screen="screen-drop">Drop Picker</button>
    <button class="tab" data-screen="screen-finds">My Finds</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
